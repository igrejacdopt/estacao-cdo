<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estação CDO - Casa de Oração para Todos os Povos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B132B">
  <style>
    :root {
      --bg-dark: #0B132B;
      --card-bg: #1C2541;
      --card-gradient: linear-gradient(145deg, #1C2541, #131B31);
      --accent-color: #F59E0B;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: rgba(245, 158, 11, 0.25);
      --kids-purple: #A855F7;
      --kids-light: #C084FC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070D1F;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .app-viewport {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .app-viewport {
        max-width: 750px;
        height: 92vh;
        border-radius: 24px;
        border: 2px solid var(--border-color);
      }
    }

    /* TOPO LIMPO */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-gradient);
      padding: 14px 18px;
      border-bottom: 2px solid var(--accent-color);
      flex-shrink: 0;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--accent-color);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .brand h1 {
      font-size: 1.15rem;
      color: var(--accent-color);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .points-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ÁREA DE CONTEÚDO */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 85px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-content::-webkit-scrollbar { width: 4px; }
    .app-content::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 4px; }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.25s ease-in-out;
    }

    .tab-pane.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARD DO RÁDIO */
    .radio-card {
      background: var(--card-gradient);
      padding: 20px 16px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .radio-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #EF4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #EF4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .listener-badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .radio-card h2 {
      font-size: 1.15rem;
      color: var(--text-light);
      margin-bottom: 10px;
    }

    /* SELETOR DE SKIN (MODERNO VS ANOS 90) */
    .skin-toggle {
      display: inline-flex;
      background: rgba(11, 19, 43, 0.85);
      padding: 4px;
      border-radius: 22px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      position: relative;
      z-index: 5;
    }

    .skin-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .skin-btn.active {
      background: var(--accent-color);
      color: #0B132B;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* VISUALIZADORES E BOTÃO PLAY */
    .play-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 10px 0;
      min-height: 82px;
    }

    .wave-sim {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
    }

    .play-container.analog-mode .wave-sim {
      display: none;
    }

    .wave-bar {
      width: 4px;
      height: 8px;
      background: var(--accent-color);
      border-radius: 3px;
      transition: height 0.2s;
    }

    .playing .wave-bar {
      animation: wave 0.9s ease-in-out infinite alternate;
    }
    .playing .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .wave-bar:nth-child(4) { animation-delay: 0.6s; }

    @keyframes wave {
      0% { height: 6px; opacity: 0.4; }
      100% { height: 34px; opacity: 1; }
    }

    /* MEDIDORES ANALÓGICOS ANOS 90 (VU METERS) */
    .vu-meter {
      display: none;
      width: 82px;
      height: 50px;
      background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 100%);
      border: 2.5px solid #475569;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.45), 0 4px 10px rgba(0,0,0,0.3);
    }

    .play-container.analog-mode .vu-meter {
      display: block;
    }

    .vu-scale {
      position: absolute;
      top: 7px;
      left: 8px;
      right: 8px;
      height: 16px;
      border-top: 2px dashed #1E293B;
      border-radius: 50%;
    }

    .vu-scale::after {
      content: 'VU dB';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      font-weight: 900;
      color: #1E293B;
    }

    .vu-needle {
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 2px;
      height: 38px;
      background: #DC2626;
      transform-origin: bottom center;
      transform: rotate(-38deg);
      transition: transform 0.14s ease-out;
    }

    .vu-pivot {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #1E293B;
      border-radius: 50%;
    }

    .play-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0B132B;
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 0 22px var(--accent-glow);
      transition: transform 0.15s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    /* EQUALIZADOR VERTICAL DE 3 BANDAS (BASS, MID, HIGH) */
    .eq-panel {
      background: rgba(11, 19, 43, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 14px;
      margin: 12px auto 0 auto;
      max-width: 260px;
    }

    .eq-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .eq-bands {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
    }

    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .eq-slider-wrap {
      height: 85px;
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eq-band input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      transform: rotate(-90deg);
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .eq-band input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .eq-band label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    .eq-val {
      font-size: 0.62rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* CONTROLO DE VOLUME */
    .volume-control-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      background: rgba(28, 37, 65, 0.6);
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .volume-btn {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .volume-slider {
      width: 180px;
      height: 8px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .status-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 10px;
      font-weight: 500;
    }

    /* CARDS GERAIS */
    .section-title {
      font-size: 0.95rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-box {
      background: var(--card-gradient);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .invite-card {
      background: var(--card-gradient);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px dashed var(--accent-color);
    }

    .invite-btn {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* CARROSSEL FOTOS */
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
    }

    .carousel-item {
      min-width: 220px;
      height: 130px;
      background: var(--card-bg);
      border-radius: 12px;
      scroll-snap-align: start;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .carousel-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,19,43,0.95), transparent 60%);
    }

    .carousel-caption {
      position: relative;
      z-index: 1;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-light);
      width: 100%;
    }

    /* MODAL FOTOS */
    #photoModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 13, 31, 0.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    #modalImg {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      border: 2px solid var(--accent-color);
    }

    #modalCaption {
      color: var(--text-light);
      margin-top: 15px;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 600;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* VÍDEOS & KIDS */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      margin-top: 10px;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .kids-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .kids-cat-btn {
      position: relative;
      height: 150px;
      border-radius: 16px;
      border: 2px solid rgba(168, 85, 247, 0.45);
      background-color: #1a103c;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      text-align: left;
    }

    .kids-cat-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11, 19, 43, 0.95) 20%, rgba(11, 19, 43, 0.2) 100%);
    }

    .kids-cat-info {
      position: relative;
      z-index: 2;
    }

    .kids-player-area {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .kids-player-area.active { display: flex; }

    .kids-back-btn {
      align-self: flex-start;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--kids-purple);
      color: var(--text-light);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* AGENDA / CALENDÁRIO */
    .event-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: rgba(11, 19, 43, 0.5);
      border-radius: 12px;
      border-left: 4px solid var(--accent-color);
      margin-top: 10px;
    }

    .event-date {
      background: var(--accent-color);
      color: #0B132B;
      padding: 8px 10px;
      border-radius: 10px;
      text-align: center;
      font-weight: 800;
      min-width: 54px;
    }

    .event-date span {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
    }

    /* QUIZ INTERATIVO */
    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .quiz-option:hover {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.12);
    }

    /* CONFIGURAÇÕES & CORES */
    .color-swatches {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-swatch:active { transform: scale(0.9); }

    /* DOCK INFERIOR FIXO */
    .bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #111936;
      border-top: 1.5px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 2px;
      z-index: 100;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.5);
    }

    .dock-item {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 2px;
      transition: 0.2s;
    }

    .dock-icon {
      font-size: 1.25rem;
      transition: transform 0.2s;
    }

    .dock-label {
      font-size: 0.65rem;
      font-weight: 600;
    }

    .dock-item.active { color: var(--accent-color); }
