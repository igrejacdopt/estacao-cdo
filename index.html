<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estação CDO</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B132B">
  <style>
    :root {
      --bg-dark: #0B132B;
      --card-bg: #1C2541;
      --card-gradient: linear-gradient(145deg, #1C2541, #131B31);
      --accent-color: #F59E0B;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: rgba(245, 158, 11, 0.25);
      --kids-purple: #A855F7;
      --kids-light: #C084FC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100dvh;
      padding-bottom: 85px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-gradient);
      padding: 12px 16px;
      border-bottom: 2px solid var(--accent-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-container { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 40px; height: 40px; border: 1.5px solid var(--accent-color); border-radius: 50%; object-fit: cover; }
    .brand h1 { font-size: 1.1rem; color: var(--accent-color); line-height: 1.1; }
    .brand p { font-size: 0.68rem; color: var(--text-muted); }

    .points-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .app-content {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tab-pane { display: none; flex-direction: column; gap: 14px; }
    .tab-pane.active { display: flex; }

    .radio-card {
      background: var(--card-gradient);
      padding: 18px 14px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .radio-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .live-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(239, 68, 68, 0.15); color: #EF4444;
      padding: 4px 10px; border-radius: 12px; font-size: 0.68rem; font-weight: bold;
    }
    .live-dot { width: 7px; height: 7px; background: #EF4444; border-radius: 50%; }
    .listener-badge {
      font-size: 0.72rem; color: var(--accent-color);
      background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 12px;
    }

    .skin-toggle {
      display: inline-flex; background: rgba(11, 19, 43, 0.9);
      padding: 4px; border-radius: 20px; border: 1px solid var(--border-color); margin: 8px 0 12px 0;
    }
    .skin-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 6px 14px; font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer;
    }
    .skin-btn.active { background: var(--accent-color); color: #0B132B; }

    .play-container {
      display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0; min-height: 80px;
    }

    .wave-sim { display: flex; align-items: center; gap: 4px; height: 36px; }
    .play-container.analog-mode .wave-sim { display: none; }
    .wave-bar { width: 4px; height: 10px; background: var(--accent-color); border-radius: 3px; }
    .playing .wave-bar { animation: wave 0.8s ease-in-out infinite alternate; }
    .playing .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .wave-bar:nth-child(4) { animation-delay: 0.6s; }
    @keyframes wave { 0% { height: 6px; opacity: 0.4; } 100% { height: 34px; opacity: 1; } }

    .vu-meter {
      display: none; width: 80px; height: 48px;
      background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 100%);
      border: 2px solid #475569; border-radius: 8px; position: relative; overflow: hidden;
    }
    .play-container.analog-mode .vu-meter { display: block; }
    .vu-scale { position: absolute; top: 6px; left: 8px; right: 8px; height: 16px; border-top: 2px dashed #1E293B; border-radius: 50%; }
    .vu-needle {
      position: absolute; bottom: -4px; left: 50%; width: 2px; height: 36px;
      background: #DC2626; transform-origin: bottom center; transform: rotate(-38deg); transition: transform 0.14s ease-out;
    }
    .vu-pivot { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background: #1E293B; border-radius: 50%; }

    .play-btn {
      width: 74px; height: 74px; border-radius: 50%; border: none;
      background: var(--accent-color); color: #0B132B; font-size: 1.7rem;
      cursor: pointer; box-shadow: 0 0 22px var(--accent-glow);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* EQUALIZADOR VERTICAL */
    .eq-panel {
      background: rgba(11, 19, 43, 0.7); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 10px 16px; margin: 10px auto 0 auto; display: inline-block;
    }
    .eq-title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
    .eq-bands { display: flex; justify-content: center; align-items: center; gap: 24px; }
    .eq-band { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .eq-slider-wrap { height: 80px; width: 24px; display: flex; align-items: center; justify-content: center; }
    .eq-band input[type="range"] { width: 76px; height: 6px; transform: rotate(-90deg); accent-color: var(--accent-color); }
    .eq-band label { font-size: 0.68rem; font-weight: 800; color: var(--accent-color); }
    .eq-val { font-size: 0.62rem; color: var(--text-muted); }

    .volume-control-box {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-top: 12px; background: rgba(28, 37, 65, 0.6); padding: 10px 16px; border-radius: 14px;
    }
    .volume-btn { background: transparent; border: none; color: var(--accent-color); font-size: 1.3rem; cursor: pointer; }
    .volume-slider { width: 170px; height: 8px; accent-color: var(--accent-color); }
    .status-text { font-size: 0.82rem; color: var(--text-muted); margin-top: 10px; }

    .card-box { background: var(--card-gradient); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); }
    .section-title { font-size: 0.95rem; color: var(--text-light); }
    .invite-card {
      background: var(--card-gradient); padding: 14px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; border: 1px dashed var(--accent-color);
    }
    .invite-btn { background: #25D366; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 0.75rem; }

    .carousel { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 6px; }
    .carousel-item {
      min-width: 210px; height: 120px; border-radius: 12px; display: flex; align-items: flex-end;
      padding: 12px; background-size: cover; background-position: center; position: relative; overflow: hidden;
    }
    .carousel-item::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,19,43,0.9), transparent 60%); }
    .carousel-caption { position: relative; z-index: 1; font-size: 0.78rem; font-weight: 600; }

    #photoModal {
      display: none; position: fixed; inset: 0; background: rgba(7, 13, 31, 0.95);
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    #modalImg { max-width: 100%; max-height: 75vh; border-radius: 16px; border: 2px solid var(--accent-color); }
    .modal-close {
      position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1);
      border: 1px solid var(--accent-color); color: var(--accent-color); width: 40px; height: 40px; border-radius: 50%;
    }

    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; margin-top: 10px; background: #000; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .kids-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .kids-cat-btn {
      position: relative; height: 140px; border-radius: 16px; border: 2px solid rgba(168, 85, 247, 0.45);
      background-color: #1a103c; background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; text-align: left; overflow: hidden;
    }
    .kids-cat-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,19,43,0.95) 20%, transparent); }
    .kids-cat-info { position: relative; z-index: 2; }
    .kids-player-area { display: none; flex-direction: column; gap: 12px; }
    .kids-player-area.active { display: flex; }
    .kids-back-btn { align-self: flex-start; background: rgba(168, 85, 247, 0.2); border: 1px solid var(--kids-purple); color: #fff; padding: 8px 14px; border-radius: 10px; }

    .event-item { display: flex
