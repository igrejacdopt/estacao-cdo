<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estação CDO - Casa de Oração para Todos os Povos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B132B">
  <style>
    :root {
      --bg-dark: #0B132B;
      --card-bg: #1C2541;
      --card-gradient: linear-gradient(145deg, #1C2541, #131B31);
      --accent-gold: #F59E0B;
      --accent-gold-glow: rgba(245, 158, 11, 0.4);
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: rgba(245, 158, 11, 0.2);
      --kids-purple: #A855F7;
      --kids-light: #C084FC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070D1F;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .app-viewport {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .app-viewport {
        max-width: 750px;
        height: 92vh;
        border-radius: 24px;
        border: 2px solid var(--border-color);
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-gradient);
      padding: 16px 20px;
      border-bottom: 2px solid var(--accent-gold);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 10px var(--accent-gold-glow);
    }

    .brand h1 {
      font-size: 1.15rem;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .points-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-content::-webkit-scrollbar {
      width: 4px;
    }
    .app-content::-webkit-scrollbar-thumb {
      background: var(--accent-gold);
      border-radius: 4px;
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: var(--bg-dark);
      box-shadow: 0 4px 12px var(--accent-gold-glow);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-pane.active {
      display: flex;
    }

    .radio-card {
      background: var(--card-gradient);
      padding: 24px 16px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #EF4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #EF4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .radio-card h2 {
      font-size: 1.15rem;
      color: var(--text-light);
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .play-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 18px 0;
    }

    .wave-sim {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 30px;
    }

    .wave-bar {
      width: 3px;
      background: var(--accent-gold);
      border-radius: 3px;
      animation: wave 1.2s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.6s; }

    @keyframes wave {
      0% { height: 6px; opacity: 0.4; }
      100% { height: 26px; opacity: 1; }
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: var(--accent-gold);
      color: var(--bg-dark);
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-gold-glow);
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center
