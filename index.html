<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estação CDO - Casa de Oração para Todos os Povos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EFEAE2">
  <style>
    :root {
      /* TEMA SOFT (PADRÃO ACOLHEDOR) */
      --outer-bg: #EAE4DA;
      --bg-dark: #F5F1EB;
      --card-bg: #FAF7F2;
      --card-gradient: linear-gradient(145deg, #FCF9F4, #EFE9DF);
      --radio-card-bg: linear-gradient(145deg, rgba(252, 249, 244, 0.78), rgba(239, 233, 223, 0.84)), url("bannerouro.png");
      --surface-soft: #E8E1D5;
      --accent-gold: #C27412;
      --accent-gold-strong: #A85E08;
      --accent-gold-glow: rgba(194, 116, 18, 0.25);
      --text-light: #222938;
      --text-muted: #5A6478;
      --border-color: rgba(194, 116, 18, 0.28);
      --subtle-border: rgba(34, 41, 56, 0.1);
      --dock-bg: rgba(250, 247, 242, 0.96);
      --dock-active-bg: rgba(194, 116, 18, 0.16);
      --radio-btn-text: #FFFDF9;
      --spectrum-bg: rgba(230, 224, 214, 0.82);
      --spectrum-dot-idle: rgba(34, 41, 56, 0.08);
      --kids-purple: #8B5CF6;
      --kids-light: #6D28D9;
      --kids-header-bg: linear-gradient(145deg, #F3ECFF, #E6DCFA);
      --kids-card-overlay: linear-gradient(to top, rgba(30, 22, 54, 0.88) 22%, rgba(30, 22, 54, 0.18) 100%);
      --modal-bg: rgba(34, 41, 56, 0.92);
      --shadow-soft: 0 10px 24px rgba(34, 41, 56, 0.08);
    }

    body.theme-dark {
      /* TEMA ESCURO (ALTERNÁVEL NOS AJUSTES) */
      --outer-bg: #070D1F;
      --bg-dark: #0B132B;
      --card-bg: #1C2541;
      --card-gradient: linear-gradient(145deg, #1C2541, #131B31);
      --radio-card-bg: linear-gradient(145deg, #1C2541, #131B31);
      --surface-soft: rgba(11, 19, 43, 0.65);
      --accent-gold: #F59E0B;
      --accent-gold-strong: #FBBF24;
      --accent-gold-glow: rgba(245, 158, 11, 0.35);
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: rgba(245, 158, 11, 0.24);
      --subtle-border: rgba(248, 250, 252, 0.08);
      --dock-bg: #0B132B;
      --dock-active-bg: rgba(245, 158, 11, 0.15);
      --radio-btn-text: #0B132B;
      --spectrum-bg: #050A18;
      --spectrum-dot-idle: rgba(255, 255, 255, 0.04);
      --kids-purple: #A855F7;
      --kids-light: #C084FC;
      --kids-header-bg: linear-gradient(145deg, #1C2541, #1A103C);
      --kids-card-overlay: linear-gradient(to top, rgba(11, 19, 43, 0.95) 20%, rgba(11, 19, 43, 0.2) 100%);
      --modal-bg: rgba(7, 13, 31, 0.96);
      --shadow-soft: 0 12px 26px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--outer-bg);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app-viewport {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 45px rgba(34, 41, 56, 0.14);
      overflow: hidden;
      transition: background-color 0.25s ease;
    }

    @media (min-width: 768px) {
      .app-viewport {
        max-width: 750px;
        height: 92vh;
        border-radius: 24px;
        border: 1.5px solid var(--border-color);
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-gradient);
      padding: 12px 20px;
      border-bottom: 1.5px solid var(--border-color);
      position: relative;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 10px var(--accent-gold-glow);
    }

    .brand h1 {
      font-size: 1.05rem;
      color: var(--accent-gold);
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .points-badge {
      background: var(--dock-active-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold-strong);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    body.theme-dark .points-badge {
      color: var(--accent-gold);
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 100px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 10;
      pointer-events: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app-content::-webkit-scrollbar {
      width: 4px;
    }
    .app-content::-webkit-scrollbar-thumb {
      background: var(--accent-gold);
      border-radius: 4px;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-pane.active {
      display: flex;
    }

    /* DOCK FIXO BLINDADO COM TAMANHO FIXO GARANTIDO */
    .bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: var(--dock-bg);
      border-top: 1.5px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      z-index: 999999;
      box-shadow: 0 -6px 22px rgba(34, 41, 56, 0.12);
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    body.theme-dark .bottom-dock {
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
    }

    .bottom-dock::-webkit-scrollbar {
      display: none;
    }

    @media (min-width: 768px) {
      .bottom-dock {
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
        justify-content: flex-start;
      }
    }

    .dock-item {
      flex: 0 0 74px !important;
      width: 74px !important;
      height: 68px !important;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
      border-radius: 12px;
      transition: background 0.2s, color 0.2s;
      user-select: none;
      pointer-events: auto;
      z-index: 1000000;
    }

    .dock-item .dock-icon {
      font-size: 1.5rem !important;
      pointer-events: none;
    }

    .dock-item span:not(.dock-icon) {
      font-size: 0.7rem !important;
      pointer-events: none;
      white-space: nowrap;
    }

    .dock-item.active {
      color: var(--accent-gold-strong);
      background: var(--dock-active-bg);
    }

    body.theme-dark .dock-item.active {
      color: var(--accent-gold);
    }

    /* BOTÃO RÁDIO AO CENTRO COM TAMANHO FIXO BLINDADO */
    .dock-radio-center {
      flex: 0 0 72px !important;
      width: 72px !important;
      height: 72px !important;
      scroll-snap-align: center;
      background: var(--accent-gold);
      color: var(--radio-btn-text);
      border-radius: 50%;
      border: 3px solid var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--accent-gold-glow);
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s;
      user-select: none;
      pointer-events: auto;
      z-index: 1000001;
    }

    .dock-radio-center:active {
      transform: scale(0.92);
    }

    .dock-radio-center .dock-icon {
      font-size: 1.7rem !important;
      pointer-events: none;
    }

    .dock-radio-center span:not(.dock-icon) {
      font-size: 0.62rem !important;
      line-height: 1;
      font-weight: 800;
      pointer-events: none;
      white-space: nowrap;
    }

    /* CARDS DE CONTEÚDO */
    .info-card {
      background: var(--card-gradient);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-card h3 {
      color: var(--accent-gold-strong);
      font-size: 1.05rem;
    }

    body.theme-dark .info-card h3 {
      color: var(--accent-gold);
    }

    .info-card p, .info-card li {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.48;
    }

    .info-card strong {
      color: var(--text-light);
    }

    /* ESTILOS DA PALAVRA DO DIA + HISTÓRICO 7 DIAS */
    .palavra-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .palavra-day-pill {
      display: inline-block;
      background: var(--dock-active-bg);
      color: var(--accent-gold-strong);
      border: 1px solid var(--border-color);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    body.theme-dark .palavra-day-pill {
      color: var(--accent-gold);
    }

    .palavra-today-btn {
      background: var(--dock-active-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold-strong);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
    }

    body.theme-dark .palavra-today-btn {
      color: var(--accent-gold);
    }

    .palavra-theme {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .verse-box {
      background: var(--dock-active-bg);
      border-left: 3px solid var(--accent-gold);
      padding: 12px;
      border-radius: 10px;
      font-style: italic;
      color: var(--text-light);
      font-size: 0.85rem;
      line-height: 1.48;
    }

    .palavra-block-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-gold-strong);
      font-weight: 800;
      margin-bottom: 3px;
    }

    body.theme-dark .palavra-block-label {
      color: var(--accent-gold);
    }

    .application-box {
      background: var(--surface-soft);
      border: 1px solid var(--subtle-border);
      border-radius: 10px;
      padding: 11px 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .history-item {
      width: 100%;
      text-align: left;
      background: var(--surface-soft);
      border: 1px solid var(--subtle-border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--text-light);
      pointer-events: auto;
    }

    .history-item.selected {
      border-color: var(--accent-gold);
      background: var(--dock-active-bg);
    }

    .history-item-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .history-item-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-item-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-gold-strong);
      white-space: nowrap;
    }

    body.theme-dark .history-item-badge {
      color: var(--accent-gold);
    }

    .radio-card {
      background: var(--radio-card-bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 14px 16px;
      border-radius: 16px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-color);
      position: relative;
      z-index: 15;
    }

    body.theme-dark .radio-card {
      background-image: none;
      background-color: var(--card-bg);
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(220, 38, 38, 0.14);
      color: #DC2626;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: bold;
      border: 1px solid rgba(220, 38, 38, 0.28);
    }

    body.theme-dark .live-indicator {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #DC2626;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(220, 38, 38, 0.6);
      animation: pulse 1.5s infinite;
    }

    body.theme-dark .live-dot {
      background-color: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .radio-card h2 {
      font-size: 1.05rem;
      color: var(--text-light);
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .play-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      position: relative;
      z-index: 20;
    }

    .play-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--accent-gold);
      color: var(--radio-btn-text);
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-gold-glow);
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 25;
      pointer-events: auto;
    }

    .play-btn:active {
      transform: scale(0.94);
    }

    .spectrum-container {
      background: var(--spectrum-bg);
      border-radius: 12px;
      padding: 6px;
      margin: 8px 0;
      border: 1px solid var(--border-color);
      box-shadow: inset 0 2px 10px rgba(34, 41, 56, 0.08);
      display: flex;
      justify-content: center;
    }

    body.theme-dark .spectrum-container {
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
    }

    #spectrumCanvas {
      width: 100%;
      max-width: 320px;
      height: 85px;
      display: block;
    }

    .volume-control-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      background: var(--surface-soft);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--subtle-border);
      position: relative;
      z-index: 20;
    }

    .volume-btn {
      background: transparent;
      border: none;
      color: var(--accent-gold-strong);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px;
      pointer-events: auto;
    }

    body.theme-dark .volume-btn {
      color: var(--accent-gold);
    }

    .volume-slider {
      width: 180px;
      height: 8px;
      accent-color: var(--accent-gold);
      cursor: pointer;
      border-radius: 4px;
      pointer-events: auto;
    }

    .status-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 600;
    }

    .settings-card {
      background: var(--card-gradient);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .theme-switch-box {
      background: var(--surface-soft);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-option-btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--subtle-border);
      background: var(--card-bg);
      color: var(--text-light);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      pointer-events: auto;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    .theme-option-btn.active {
      border-color: var(--accent-gold);
      background: var(--dock-active-bg);
      color: var(--accent-gold-strong);
    }

    body.theme-dark .theme-option-btn.active {
      color: var(--accent-gold);
    }

    .eq-panel {
      background: var(--surface-soft);
      border: 1px solid var(--subtle-border);
      border-radius: 12px;
      padding: 12px;
    }

    .eq-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .eq-bands {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .eq-slider-wrap {
      height: 75px;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eq-band input[type="range"] {
      width: 70px;
      height: 6px;
      transform: rotate(-90deg);
      cursor: pointer;
      accent-color: var(--accent-gold);
      pointer-events: auto;
    }

    .eq-band label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent-gold-strong);
    }

    body.theme-dark .eq-band label {
      color: var(--accent-gold);
    }

    .eq-val {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      position: relative;
      z-index: 20;
    }

    .carousel::-webkit-scrollbar {
      height: 4px;
    }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent-gold);
      border-radius: 10px;
    }

    .carousel-item {
      min-width: 210px;
      height: 120px;
      background: var(--card-bg);
      border-radius: 12px;
      scroll-snap-align: start;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 21;
      pointer-events: auto;
    }

    .carousel-item:active {
      transform: scale(0.98);
    }

    .carousel-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(24, 30, 44, 0.88), transparent 62%);
      pointer-events: none;
    }

    .carousel-caption {
      position: relative;
      z-index: 22;
      font-size: 0.75rem;
      font-weight: 600;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      pointer-events: none;
    }

    #photoModal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      pointer-events: auto;
    }

    #modalImg {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    #modalCaption {
      color: #F8FAFC;
      margin-top: 15px;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 600;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      background: rgba(245, 158, 11, 0.22);
      border: 1px solid var(--accent-gold);
      color: #FBBF24;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
