<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação CDO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B132B">
    <style>
        :root {
            --bg-primary: #070D1F;
            --bg-secondary: #0B132B;
            --accent-gold: #D4AF37;
            --text-color: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background-color: var(--bg-secondary);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            border-bottom: 2px solid var(--accent-gold);
        }
        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--accent-gold);
            object-fit: cover;
        }
        header h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-gold);
        }
        main {
            flex: 1;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .install-btn {
            background: var(--accent-gold);
            color: var(--bg-secondary);
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .install-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="logo.jpg" alt="Logo CDO">
            <h1>Estação CDO</h1>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Bem-vindo à Estação CDO</h2>
            <p>Comunhão, edificação e conteúdo cristão onde quer que esteja.</p>
            
            <!-- Botão Sempre Visível -->
            <div id="install-container">
                <button id="btnInstall" class="install-btn">
                    📲 Instalar Estação CDO
                </button>
            </div>
        </div>
    </main>

    <script>
        // Registo do Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registado!'))
                .catch((err) => console.log('Erro no SW:', err));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-container').style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert("Para instalar no Chrome/Brave, toque nos três pontinhos no canto superior direito do navegador e selecione 'Adicionar à tela inicial' ou 'Instalar aplicativo'.");
            }
        });
    </script>
</body>
</html>
